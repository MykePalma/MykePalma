    <circle cx="92" cy="58" r="1.6" opacity=".6"/><circle cx="210" cy="240" r="1.2" opacity=".5"/><circle cx="330" cy="46" r="1.4" opacity=".5"/>
    <circle cx="486" cy="262" r="1.6" opacity=".4"/><circle cx="640" cy="34" r="1.2" opacity=".6"/><circle cx="822" cy="258" r="1.5" opacity=".5"/>
    <circle cx="962" cy="72" r="1.8" opacity=".7"/><circle cx="1108" cy="212" r="1.3" opacity=".5"/><circle cx="1152" cy="90" r="1.2" opacity=".5"/>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="600" fill="url(#name)">Hi, I'm Myke</text>
