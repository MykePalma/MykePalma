      <stop offset="0" stop-color="#141417"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f3f1"/>
      <stop offset="0.55" stop-color="#e8b04b"/>
      <stop offset="1" stop-color="#7fb5b5"/>
    </linearGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#e8b04b" stop-opacity="0.26"/><stop offset="1" stop-color="#e8b04b" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#7fb5b5" stop-opacity="0.2"/><stop offset="1" stop-color="#7fb5b5" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
